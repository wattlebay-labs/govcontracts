name: fetch-data
# Daily pull of contract notices from the official AusTender OCDS API.
# The dataset and its cursors travel from run to run in the workflow cache,
# so a run only asks the API for what is new, and a new dataset is built up
# over several runs instead of one long one. Only the small summary is
# committed, so the repository does not grow by megabytes a day.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *" # 05:17 Melbourne (AEDT)
  push:
    paths:
      - "scripts/fetch.mjs"
      - ".github/workflows/fetch.yml"

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/fetch.test.mjs
      - name: Restore dataset from the previous run
        uses: actions/cache/restore@v4
        with:
          path: |
            data/contracts.json
            data/state.json
          key: dataset-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dataset-v1-
      - run: node scripts/fetch.mjs
        env:
          # Seconds of fetching per run; the next run resumes where this stops.
          BUDGET_SECONDS: "720"
      - name: Save dataset for the next run
        uses: actions/cache/save@v4
        with:
          path: |
            data/contracts.json
            data/state.json
          key: dataset-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: |
            data/contracts.json
            data/state.json
          retention-days: 14
      - name: Commit summary
        if: ${{ !cancelled() }}
        run: |
          git config user.name "govcontracts-bot"
          git config user.email "govcontracts-bot@users.noreply.github.com"
          git add data/summary.json
          git commit -m "Data summary $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase --autostash
          git push
